<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>yoink social preview</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; }
  body {
    background: #0a0a0f;
    color: #fafafa;
    font-family: Arial, sans-serif;
    display: flex;
    align-items: center;
    padding: 90px;
  }
  main { width: 100%; }
  .brand { display: flex; align-items: center; gap: 28px; }
  img { width: 120px; height: 120px; }
  h1 { margin: 0; font-size: 96px; letter-spacing: -5px; }
  h1 span { color: #a78bfa; }
  p { margin: 42px 0 0; font-size: 34px; color: #d4d4df; }
  .tools { color: #a78bfa; font-size: 25px; margin-top: 28px; }
  .note { color: #a1a1aa; font-size: 23px; margin-top: 48px; }
</style>
<main>
  <div class="brand">
    <img src="../frontend/static/icons/icon-512.png" alt="">
    <h1>yoink<span>.tools</span></h1>
  </div>
  <p>just paste the link and yoink it</p>
  <p class="tools">download · convert · compress · trim · transcribe</p>
  <p class="note">free · open source · no ads · no sign-up</p>
</main>
</html>
